# SPDX-License-Identifier: AGPL-3.0-or-later
[lints]
workspace = true

[package]
name = "petal-tongue-discovery"
description = "Capability-based primal discovery for the ecoPrimals ecosystem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Canonical ecosystem types
cellmembrane-types = { workspace = true }
# Core dependencies
petal-tongue-core = { path = "../petal-tongue-core" }
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util", "fs", "macros"] }
thiserror = { workspace = true }

# HTTP client (thin hyper wrapper via petal-tongue-ipc)
petal-tongue-ipc = { path = "../petal-tongue-ipc" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

# Low-level socket for multicast (uses libc for syscalls, not C crypto)
socket2 = { workspace = true, optional = true }

# LRU cache for performance optimization (Phase 2) - pure Rust
lru = { workspace = true, optional = true }

# Modern async patterns (Discovery Evolution)
futures-util = { workspace = true }
rand = { workspace = true }

[features]
default = ["mdns"]
# mDNS multicast auto-discovery (zero-config). Pulls in `socket2` for
# raw UDP multicast. Disable for air-gapped or CI environments.
mdns = ["dep:socket2"]
# Enables ProviderCache (LRU + TTL caching layer for discovery results)
cache = ["dep:lru"]
# Mock provider - Run tests with: cargo test --features test-fixtures
test-fixtures = ["petal-tongue-core/test-fixtures"]

[dev-dependencies]
anyhow = "1.0"  # Unit tests and #[cfg(test)] helpers (mock_server, errors tests)
petal-tongue-core = { path = "../petal-tongue-core", features = ["test-fixtures"] }
tokio-test = { workspace = true }
wiremock = { workspace = true }
futures-util = { workspace = true }
tempfile = { workspace = true }

